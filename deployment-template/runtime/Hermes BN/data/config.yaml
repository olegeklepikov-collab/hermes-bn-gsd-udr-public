model:
  provider: openai-codex
  default: gpt-6.1-sol
auth:
  adopt_external_logins: false
  codex_login_flow: browser
terminal:
  backend: bn_guarded_local
  cwd: __HERMES_BN_ROOT__/workspace
  home_mode: profile
desktop:
  repo_scan_roots:
  - __HERMES_BN_ROOT__/workspace
display:
  skin: hermes-bn
  interim_assistant_messages: true
  show_commentary: true
  platforms:
    telegram:
      tool_progress: 'off'
      interim_assistant_messages: true
      show_commentary: true
      show_reasoning: false
      thinking_progress: false
_config_version: 46
platforms: {}
web:
  backend: exa
  search_backend: exa
  extract_backend: firecrawl
  provider_tier:
    exa: paid
    firecrawl: paid
    tavily: paid
    keenable: paid
  keyless_fallback: false
  keyless_rescue: false
  extract_char_limit: 20000
  cache_enabled: true
  cache_ttl_minutes: 20
  provider_tiers:
    parallel: paid
mcp_servers:
  firecrawl:
    url: https://mcp.firecrawl.dev/v2/mcp
    enabled: false
    lazy: true
    timeout: 180
    connect_timeout: 60
    keepalive_interval: 180
    tools:
      exclude:
      - firecrawl_feedback
      - firecrawl_search_feedback
  exa:
    url: https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa,web_search_advanced_exa,agent_run
    enabled: false
    lazy: true
    timeout: 180
    connect_timeout: 60
    keepalive_interval: 180
  tavily:
    command: __HERMES_BN_ROOT__/hermes-agent/venv/bin/python
    args:
    - __HERMES_BN_ROOT__/Tavily/mcp_server.py
    env:
      HERMES_HOME: __HERMES_BN_ROOT__/data
      HERMES_BN_ROOT: __HERMES_BN_ROOT__
      PYTHONPATH: __HERMES_BN_ROOT__/hermes-agent:/Volumes/AgentRuntime2/active-runtime/Hermes
        BN/Tavily
    enabled: false
    lazy: true
    timeout: 420
    connect_timeout: 60
    keepalive_interval: 180
  keenable:
    url: https://api.keenable.ai/mcp
    enabled: false
    lazy: true
    timeout: 180
    connect_timeout: 60
    keepalive_interval: 180
  keenable-select:
    url: https://select.keenable.ai/mcp
    lazy: true
    timeout: 600
    connect_timeout: 60
    keepalive_interval: 180
    enabled: false
  nimble:
    url: https://mcp.nimbleway.com/mcp
    enabled: false
    lazy: true
    timeout: 300
    connect_timeout: 60
    keepalive_interval: 180
    tools:
      exclude:
      - nimble_agents_delete
      - nimble_extract_templates_generate
      - nimble_extract_templates_generation_status
      - nimble_extract_templates_update_from_template
  nimble-docs:
    url: https://docs.nimbleway.com/mcp
    enabled: false
    lazy: true
    timeout: 60
    connect_timeout: 30
    keepalive_interval: 180
    tools:
      exclude:
      - submit_feedback
  parallel-search:
    url: https://search.parallel.ai/mcp?mode=fast
    enabled: false
    lazy: true
    timeout: 90
  parallel-task:
    url: https://task-mcp.parallel.ai/mcp
    enabled: false
    lazy: true
    timeout: 180
  consensus:
    url: https://mcp.consensus.app/mcp
    enabled: false
  scite:
    url: https://api.scite.ai/mcp
    connect_timeout: 45
    tool_timeout: 90
    tools:
      include:
      - search_literature
      - read_fulltext
      - citation_graph
      - bibliography
      - report_citations
      - citation_report
      - get_more_tools
      - search_patents
      - search_grants
      - get_grant
      - search_clinical_trials
      - get_clinical_trial
      - search_drugs
      - get_drug
      - search_device510k
      - get_device510k
      - search_510k_summaries
      - get_510k_summary
      - search_faers
      - get_faers_report
      - search_maude
      - get_maude_report
      - search_mhra
      - get_mhra_alert
      - search_collections
      - get_collection
      - list_collection_notes
      - list_collection_files
      - get_collection_file
      - get_collection_file_download_url
      - create_collection
      - add_dois_to_collection
      - create_collection_note
      - update_collection
      - update_collection_note
      - upload_collection_file
    oauth:
      client_name: Hermes BN — AgentRuntime2
      scope: mcp offline_access
      timeout: 900
    enabled: false
  undermind:
    url: https://mcp.undermind.ai/mcp
    oauth:
      scope: mcp
      timeout: 900
    connect_timeout: 45
    tool_timeout: 240
    tools:
      include:
      - get_orientation
      - list_workspaces
      - create_workspace
      - search_papers
      - find_papers_by_author
      - lookup_papers_by_metadata
      - get_paper_info
      - read_pdfs
      - get_pdf_download_links
      - launch_deep_search
      - inspect_deep_searches
      - display_deep_search_results
      - display_references
      - suggest_pdf_uploads
      - inspect_files
      - write_file
      - inspect_folders
      - create_folder
      - move_folder
      - add_papers_to_folder
      - remove_papers_from_folder
      - star_papers
      - unstar_papers
      - move_files
      - move_deep_searches
    enabled: false
  alphaxiv:
    url: https://api.alphaxiv.org/mcp/v1
    oauth:
      client_name: Hermes BN — AgentRuntime2
      scope: email profile offline_access
      timeout: 900
    connect_timeout: 45
    tool_timeout: 240
    tools:
      include:
      - answer_pdf_queries
      - get_paper_content
      - read_files_from_github_repository
      - discover_papers
      - find_researchers
      - get_researcher
      - get_researcher_papers
      - resolve_researchers
      - get_paper_notes
      - list_annotated_papers
      - list_library
      - save_papers_to_folder
      - remove_papers_from_folder
      - move_papers_between_folders
      - create_folder
      - rename_folder
      - get_for_you_feed
      - get_hot_feed
      - edit_private_paper_metadata
      - list_followed_researchers
      - follow_researcher
      - unfollow_researcher
    enabled: false
  semanticscholar:
    command: __HERMES_BN_ROOT__/bin/semantic-scholar-bn-mcp
    args: []
    connect_timeout: 30
    tool_timeout: 150
    enabled: false
    tools:
      include:
      - author_batch
      - author_search
      - author_details
      - author_papers
      - paper_autocomplete
      - paper_batch
      - paper_search
      - paper_bulk_search
      - paper_match_title
      - paper_details
      - paper_authors
      - paper_citations
      - paper_references
      - snippet_search
      - recommend_by_examples
      - recommend_for_paper
      - dataset_diffs
      - dataset_releases
      - dataset_release
      - dataset_manifest
      - service_status
  pubmed:
    command: __HERMES_BN_ROOT__/bin/pubmed-bn-mcp
    args: []
    connect_timeout: 30
    tool_timeout: 150
    enabled: false
    tools:
      include:
      - pubmed_search
      - pubmed_summary
      - pubmed_fetch
      - pubmed_links
      - pubmed_info
      - pubmed_spell
