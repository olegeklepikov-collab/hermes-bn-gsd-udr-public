    - __HERMES_BN_ROOT__/Memory/releases/1.3.0/bn_memory/server.py
    - __HERMES_BN_ROOT__/Memory/settings.json
    enabled: false
    timeout: 360
plugins:
  enabled: []
  disabled:
  - bn-common-memory
  - bn-gsd
  - bn-udr-host
  - bn-work-status
  hook_callback_timeout: 15
  entries:
    bn-gsd:
      enabled: false
      settings:
        package_root: __HERMES_BN_ROOT__/GSD/releases/0.2.13-hermes-0.22.2-r3
        settings_file: __HERMES_BN_ROOT__/GSD/operator/settings.json
        core_manifest: __HERMES_BN_ROOT__/GSD/releases/0.2.13-hermes-0.22.2-r3/release/core-manifest.json
    bn-udr-host:
      enabled: false
      settings:
        udr_root: __HERMES_UDR_ROOT__
        budget_mode: observe
        max_parallel_workers: 4
    bn-common-memory:
      enabled: false
      settings:
        config_file: __HERMES_BN_ROOT__/Memory/settings.json
    bn-work-status:
      enabled: false
